<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>VNCCS PoseStudio · 3D 人偶编辑器</title>
  <style>
    html, body { margin: 0; background: #0d0f16; color: #e8eaf2;
      font: 13px/1.5 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px; }
    #status { color: #ffd54a; min-height: 18px; }
    #stagewrap { line-height: 0; }
    #stage { display: block; width: 768px; height: 768px; background: #fff;
      border-radius: 4px; touch-action: none; }
    #bar { display: flex; gap: 8px; align-items: center; }
    #bar select, #bar button {
      background: #1b2030; color: #e8eaf2; border: 1px solid #2e3648;
      border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer;
    }
    #bar button:hover { background: #252c40; }
    #bar button#btn-export { background: #2f6b3a; border-color: #3f8a4d; }
    #hint { color: #8a90a6; font-size: 12px; }
    #out { display: flex; gap: 12px; flex-wrap: wrap; }
    #out img { background: #fff; }

    /* ---- 嵌入模式（?embed=1）：只留画布，控制条全部交给宿主 ----
       宿主要把编辑器塞进节点卡片里，自己的状态栏/工具栏会抢地方，所以这里
       只让画布填满 iframe。
       `#bar` / `#hint` 已经从 DOM 里**删掉**了（按钮只保留宿主那一份），
       这两条选择器留着当兜底：万一以后又把控件加回来，嵌入模式下也不会再
       出现"里面外面各一套"。 */
    html.embed, html.embed body { height: 100%; overflow: hidden; }
    html.embed #wrap { padding: 0; gap: 0; height: 100%; align-items: stretch; }
    html.embed #stagewrap { flex: 1; min-height: 0; }
    html.embed #stage { width: 100%; height: 100%; border-radius: 0; }
    html.embed #status,
    html.embed #bar,
    html.embed #hint,
    html.embed #out { display: none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="status">正在加载…</div>
    <div id="stagewrap"><canvas id="stage" width="768" height="768"></canvas></div>
    <!-- **这里不再有工具条**：朝向 / 重置视角 / 导出 / 提示行全部搬到宿主
         （PoseStudio.tsx）。以前这里和宿主各有一套一模一样的按钮，
         用户看到的就是"相同的东西里面又外面都有"，而且这一套的导出把结果写进
         #out，嵌入时根本看不到 → "点了没反应"。按钮只有一份，就在这里以外。 -->
    <div id="out"></div>
  </div>
  <script>
    // **嵌入模式尽早打标记**：`html.embed #bar { display:none }` 那套 CSS 一直
    // 在，但从来没被激活过（没人加这个 class）——结果节点卡片里上下两套一模一样的
    // 工具条（iframe 里的朝向/重置/导出 + 宿主的朝向/机位/导出），用户看到的就是
    // "相同的东西里面又外面都有"，而且 iframe 里那个导出点了没反应（它的结果写进
    // #out，在 embed 下本来就是隐藏的）。
    // 放在 head 里同步执行：module 脚本是延迟的，等它跑完再打标记会先闪一下工具条。
    if (new URLSearchParams(location.search).get('embed') === '1') {
      document.documentElement.classList.add('embed')
    }
  </script>
  <script>
    // **早期错误捕获**：模块脚本加载失败（MIME 不对 / 404）时，模块内部的
    // try/catch 根本不会执行（模块压根没跑）。只能在这里截，截到就立刻通知
    // 父页——否则父页只能空等到超时，用户只看到「导出超时」。
    window.addEventListener('error', function (e) {
      var t = e.target
      if (t && t.tagName === 'SCRIPT') {
        try {
          window.parent.postMessage(
            { type: 'error', message: '脚本加载失败：' + (t.src || t.getAttribute('src') || '(未知)') },
            '*')
        } catch (e2) { /* 跨域等，忽略 */ }
      }
    }, true)
    window.addEventListener('unhandledrejection', function (e) {
      try {
        window.parent.postMessage(
          { type: 'error', message: '加载失败：' + ((e.reason && e.reason.message) || e.reason) },
          '*')
      } catch (e2) { /* 忽略 */ }
    })
  </script>
  <!-- **importmap 必须在任何 module 脚本之前**（规范要求，晚了解析不到）。
       vendor/three/jsm 下的 loader 是上游原样拷贝，里面写的是 `from 'three'` 这种
       裸名，靠这条映射落到本地的 three.module.js —— 和 core.js 动态 import 的那个
       URL 完全一致，所以 loader 与 viewer 共用同一份 three 实例。
       见 vendor/three/jsm/SOURCE.md。 -->
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
  <script type="module" src="./entry.js"></script>
</body>
</html>
